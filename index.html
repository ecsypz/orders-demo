<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Orders dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#F4F5F7;color:#111827}
a{color:#1D4ED8}
.wrap{max-width:1280px;margin:0 auto;padding:24px 28px 48px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;flex-wrap:wrap;gap:16px}
.between{justify-content:space-between;align-items:center}
h1{margin:0;font-size:24px}
h2{margin:0;font-size:16px;font-weight:600}
.muted{color:#4B5563;font-size:13px}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kpi{flex:1 1 220px}.kpi .big{font-size:30px;font-weight:700}
.tabs{display:flex;background:#E5E7EB;border-radius:10px;padding:4px;gap:4px}
button{font:inherit;cursor:pointer}
.tab,.per{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid transparent;background:transparent;color:#374151;font-weight:600}
.tab[aria-pressed=true]{background:#fff;color:#111827}
.per{border-color:#D1D5DB;background:#fff;font-weight:500}
.per[aria-pressed=true]{background:#1D4ED8;border-color:#1D4ED8;color:#fff;font-weight:600}
button:focus-visible,a:focus-visible{outline:3px solid #F59E0B;outline-offset:2px}
.stage{flex:1 1 150px;border-radius:10px;padding:14px 16px}.stage .n{font-size:28px;font-weight:700}
.amber{background:#FEF3C7;color:#78350F}.blue{background:#DBEAFE;color:#1E3A8A}.grey{background:#E5E7EB;color:#1F2937}
.green{background:#D1FAE5;color:#064E3B}.red{background:#FEE2E2;color:#7F1D1D}
.stage .lab{font-weight:600;color:#111827;font-size:13px}.stage .note{font-size:12px;color:#374151}
.bars{display:flex;align-items:flex-end;gap:8px;height:190px;border-bottom:1px solid #D1D5DB}
.bars>div{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bars .v{font-size:11px;color:#374151}.bars .b{width:100%;background:#1D4ED8;border-radius:4px 4px 0 0;min-height:2px}
.labels{display:flex;gap:8px}.labels>div{flex:1 1 0;text-align:center;font-size:11px;color:#4B5563}
.track{height:10px;background:#EEF0F3;border-radius:5px;flex:1 1 auto}.fill{height:10px;border-radius:5px;background:#1D4ED8}
.fill.g{background:#6B7280}
.line{display:flex;justify-content:space-between;gap:12px;align-items:center}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:12px;color:#4B5563;padding:10px 12px;border-bottom:1px solid #E5E7EB;white-space:nowrap}
td{padding:12px;border-bottom:1px solid #EEF0F3;white-space:nowrap}
.scroll{overflow-x:auto}
.q{flex-direction:row;flex-wrap:wrap;justify-content:space-between;gap:16px}
.qty{display:inline-block;min-width:38px;font-weight:700}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid #D1D5DB;background:#fff;color:#111827;font-weight:600;text-decoration:none}
.banner{background:#FEF3C7;color:#78350F;border-radius:10px;padding:10px 14px;font-weight:600}
.empty{color:#4B5563;font-size:13px;padding:8px 0}
[hidden]{display:none!important}
  .qrbtn{font:inherit;font-size:12px;font-weight:600;min-height:32px;padding:0 10px;border:1px solid #9CA3AF;border-radius:8px;background:#fff;color:#111827;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
  .qrbtn:focus-visible{outline:2px solid #1D4ED8;outline-offset:2px}
</style>

<body>
<div class="wrap">
  <div class="row between">
    <div>
      <h1 id="title">Orders</h1>
      <div class="muted" id="sub">Loading…</div>
    </div>
    <div class="row" style="align-items:center;gap:12px">
      <div class="tabs" id="tabs" role="group" aria-label="View"></div>
      <div class="row" id="periods" role="group" aria-label="Period" style="gap:6px"></div>
    </div>
  </div>
  <form id="login" class="card" style="max-width:420px" hidden>
    <h2>Enter the dashboard password</h2>
    <label for="pw" class="muted">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required style="min-height:44px;padding:0 12px;border:1px solid #9CA3AF;border-radius:8px;font:inherit">
    <button type="submit" class="per" aria-pressed="true" style="align-self:flex-start">Open dashboard</button>
    <div id="pwerr" class="muted" role="alert" style="color:#7F1D1D"></div>
  </form>
  <div class="banner" id="demo" hidden>Demo data: these orders are invented for the demonstration.</div>
  <div class="banner red" id="err" hidden></div>
  <main id="founders" style="display:flex;flex-direction:column;gap:20px" hidden></main>
  <main id="packing" style="display:flex;flex-direction:column;gap:20px" hidden></main>
</div>
<script>
(function () {
  var state = { days: 30, view: null, data: null, stockSort: "low" };
  var $ = function (id) { return document.getElementById(id); };
  // All text goes in through textContent, so nothing from the database is ever treated as HTML.
  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === "text") e.textContent = attrs[k];
      else if (k === "style") e.style.cssText = attrs[k];
      else if (k === "on") e.addEventListener("click", attrs[k]);
      else if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  var peso = function (n) { return n == null ? "–" : "₱" + Math.round(n).toLocaleString("en-PH"); };
  function dur(s) {
    if (s == null) return "no data yet";
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min";
    if (s < 172800) { var hh = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return hh + " h" + (m ? " " + m + " min" : ""); }
    return Math.round(s / 86400) + " days";
  }
  function when(ts) {
    return new Date(ts * 1000).toLocaleString("en-PH", { timeZone: "Asia/Manila", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
  }
  var TONE = { submitted: "amber", awaiting_payment: "amber", paid: "blue", packed: "blue", shipped: "grey", delivered: "green", cancelled: "red", refunded: "red" };
  var card = function (title, kids, extra) { return h("section", { class: "card", style: extra || "" }, [title ? h("h2", { text: title }) : null].concat(kids)); };
  var empty = function (t) { return h("div", { class: "empty", text: t }); };

  function barRow(name, n, max, grey) {
    return h("div", { class: "line", style: "font-size:13px" }, [
      h("span", { text: name, style: "flex:0 0 40%" }),
      h("div", { class: "track" }, [h("div", { class: "fill" + (grey ? " g" : ""), style: "width:" + (max ? Math.round(n / max * 100) : 0) + "%" })]),
      h("span", { text: String(n), style: "flex:0 0 28px;text-align:right;font-weight:600" })
    ]);
  }

  // The only action on this page: a founder replacing an account's QR picture.
  function pickQr(a) {
    var inp = h("input", { type: "file", accept: "image/png,image/jpeg" });
    inp.addEventListener("change", function () {
      var file = inp.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) { state.note = "The picture must be under 2 MB."; return render(); }
      if (!window.confirm("Replace the QR that customers receive for " + a.label + "?")) return;
      fetch("/api/qr/" + a.id, { method: "POST", credentials: "same-origin", headers: { "X-Requested-With": "dashboard", "Content-Type": file.type || "application/octet-stream" }, body: file })
        .then(function (r) { return r.json(); })
        .then(function (j) { state.note = a.label + ": " + j.message; refresh(); })
        .catch(function () { state.note = a.label + ": upload failed."; render(); });
    });
    inp.click();
  }
